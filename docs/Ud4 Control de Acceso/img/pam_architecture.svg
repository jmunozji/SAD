<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-pam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-mod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-sys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="480" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="425" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Arquitectura y Pila de Autenticación PAM (Pluggable Authentication Modules)</text>
  <text x="425" y="54" text-anchor="middle" font-size="12" fill="#64748b">Desacoplamiento entre aplicaciones cliente y mecanismos de seguridad mediante módulos dinámicos</text>

  <!-- Capa 1: Aplicaciones -->
  <g transform="translate(30, 80)">
    <rect width="160" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="160" height="36" rx="8" fill="url(#grad-app)"/>
    <text x="80" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Aplicaciones</text>
    <text x="80" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Clientes PAM-Aware</text>

    <!-- Apps list -->
    <rect x="15" y="75" width="130" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">sshd</text>

    <rect x="15" y="125" width="130" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">sudo / su</text>

    <rect x="15" y="175" width="130" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">login / gdm</text>

    <rect x="15" y="225" width="130" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">passwd</text>

    <rect x="15" y="275" width="130" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">vsftpd / samba</text>

    <text x="80" y="340" text-anchor="middle" font-size="10" fill="#94a3b8">Invocan pam_authenticate()</text>
  </g>

  <!-- Flecha 1 -->
  <line x1="190" y1="260" x2="235" y2="260" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="212" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">API PAM</text>

  <!-- Capa 2: Biblioteca Central libpam -->
  <g transform="translate(240, 80)">
    <rect width="170" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="170" height="36" rx="8" fill="url(#grad-pam)"/>
    <text x="85" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Núcleo libpam.so</text>

    <rect x="12" y="55" width="146" height="70" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="85" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Configuración</text>
    <text x="85" y="93" text-anchor="middle" font-size="10" fill="#6d28d9">/etc/pam.d/*</text>
    <text x="85" y="111" text-anchor="middle" font-size="9" fill="#7c3aed">(sshd, common-auth, ...)</text>

    <rect x="12" y="145" width="146" height="190" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="85" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Control Flags</text>
    <text x="85" y="185" text-anchor="middle" font-size="9" fill="#64748b">(Comportamiento de Pila)</text>

    <rect x="22" y="195" width="126" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="85" y="211" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">required (obligatorio)</text>

    <rect x="22" y="227" width="126" height="24" rx="4" fill="#ffedd5" stroke="#fdba74"/>
    <text x="85" y="243" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412">requisite (corte rápido)</text>

    <rect x="22" y="259" width="126" height="24" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="85" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">sufficient (éxito directo)</text>

    <rect x="22" y="291" width="126" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="85" y="307" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">optional (informativo)</text>
  </g>

  <!-- Flecha 2 -->
  <line x1="410" y1="260" x2="455" y2="260" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="432" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">SPI</text>

  <!-- Capa 3: Módulos de Gestión -->
  <g transform="translate(460, 80)">
    <rect width="180" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="36" rx="8" fill="url(#grad-mod)"/>
    <text x="90" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Tipos de Gestión (SPI)</text>

    <!-- 4 Tipos -->
    <rect x="12" y="50" width="156" height="64" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="90" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">auth</text>
    <text x="90" y="85" text-anchor="middle" font-size="9" fill="#047857">Verifica la identidad</text>
    <text x="90" y="100" text-anchor="middle" font-size="9" font-weight="600" fill="#0f766e">pam_unix / pam_faillock</text>

    <rect x="12" y="124" width="156" height="64" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="90" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">account</text>
    <text x="90" y="159" text-anchor="middle" font-size="9" fill="#047857">Valida estado de cuenta</text>
    <text x="90" y="174" text-anchor="middle" font-size="9" font-weight="600" fill="#0f766e">Caducidad / Horarios / Shell</text>

    <rect x="12" y="198" width="156" height="64" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="90" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">password</text>
    <text x="90" y="233" text-anchor="middle" font-size="9" fill="#047857">Actualiza credenciales</text>
    <text x="90" y="248" text-anchor="middle" font-size="9" font-weight="600" fill="#0f766e">pam_pwquality (complejidad)</text>

    <rect x="12" y="272" width="156" height="64" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="90" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">session</text>
    <text x="90" y="307" text-anchor="middle" font-size="9" fill="#047857">Apertura y cierre de sesión</text>
    <text x="90" y="322" text-anchor="middle" font-size="9" font-weight="600" fill="#0f766e">pam_mkhomedir / pam_limits</text>
  </g>

  <!-- Flecha 3 -->
  <line x1="640" y1="260" x2="685" y2="260" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Capa 4: Backends del Sistema -->
  <g transform="translate(690, 80)">
    <rect width="130" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="130" height="36" rx="8" fill="url(#grad-sys)"/>
    <text x="65" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Backends</text>

    <rect x="12" y="65" width="106" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="65" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">/etc/shadow</text>
    <text x="65" y="99" text-anchor="middle" font-size="9" fill="#b45309">Hashes locales</text>

    <rect x="12" y="125" width="106" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="65" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">LDAP / AD</text>
    <text x="65" y="159" text-anchor="middle" font-size="9" fill="#b45309">Directorio corporativo</text>

    <rect x="12" y="185" width="106" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="65" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">OTP / 2FA</text>
    <text x="65" y="219" text-anchor="middle" font-size="9" fill="#b45309">Google Auth / YubiKey</text>

    <rect x="12" y="245" width="106" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="65" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Kerberos</text>
    <text x="65" y="279" text-anchor="middle" font-size="9" fill="#b45309">Tickets SSO</text>

    <rect x="12" y="305" width="106" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="65" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">faillock DB</text>
    <text x="65" y="339" text-anchor="middle" font-size="9" fill="#b45309">/run/faillock/*</text>
  </g>
</svg>