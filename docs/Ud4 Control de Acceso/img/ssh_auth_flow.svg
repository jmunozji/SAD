<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-ssh" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="850" height="440" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="425" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Autenticación SSH Asimétrica (Clave Pública vs Contraseña)</text>
  <text x="425" y="54" text-anchor="middle" font-size="12" fill="#64748b">Mecanismo de Desafío Criptográfico (Challenge-Response) sin transmisión de secretos</text>

  <!-- Cliente Column -->
  <g transform="translate(40, 80)">
    <rect width="240" height="325" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-ssh)"/>
    <rect width="240" height="38" rx="8" fill="#1e293b"/>
    <text x="120" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Cliente SSH (Host Local)</text>

    <!-- Key Pair Box -->
    <rect x="15" y="50" width="210" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="120" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Par de Claves (~/.ssh/)</text>

    <!-- Private Key -->
    <rect x="25" y="80" width="190" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="120" y="98" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Clave Privada: id_ed25519 (SECRETA)</text>

    <!-- Public Key -->
    <rect x="25" y="114" width="190" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="120" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Clave Pública: id_ed25519.pub</text>

    <!-- Step detail in client -->
    <rect x="15" y="165" width="210" height="145" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="185" font-size="11" font-weight="700" fill="#0f172a">Operaciones del Cliente:</text>
    <text x="25" y="205" font-size="10" fill="#475569">1. Inicia conexión TCP (Puerto 22/2222).</text>
    <text x="25" y="223" font-size="10" fill="#475569">2. Establece túnel seguro cifrado.</text>
    <text x="25" y="241" font-size="10" fill="#475569">3. Presenta el ID de su clave pública.</text>
    <text x="25" y="259" font-size="10" fill="#475569">4. Recibe un desafío matemático.</text>
    <text x="25" y="277" font-size="10" fill="#047857" font-weight="600">5. Firma el desafío con id_ed25519.</text>
    <text x="25" y="295" font-size="10" fill="#475569">6. Devuelve la firma al servidor.</text>
  </g>

  <!-- Middle Protocol Interactions -->
  <g transform="translate(300, 100)">
    <!-- 1. Hello -->
    <line x1="0" y1="50" x2="230" y2="50" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="115" y="42" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">1. "Quiero entrar con la clave pública X"</text>

    <!-- 2. Challenge -->
    <line x1="230" y1="120" x2="0" y2="120" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="115" y="112" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">2. Desafío aleatorio cifrado / nonce</text>

    <!-- 3. Signed Response -->
    <line x1="0" y1="190" x2="230" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="115" y="182" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">3. Desafío firmado con la clave privada</text>

    <!-- 4. Granted -->
    <rect x="35" y="235" width="160" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
    <text x="115" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Acceso Concedido</text>
  </g>

  <!-- Servidor Column -->
  <g transform="translate(570, 80)">
    <rect width="240" height="325" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-ssh)"/>
    <rect width="240" height="38" rx="8" fill="#1e293b"/>
    <text x="120" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Servidor SSH (sshd)</text>

    <!-- Authorized Keys Box -->
    <rect x="15" y="50" width="210" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="120" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Almacén de Claves Autorizadas</text>

    <rect x="25" y="80" width="190" height="58" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="120" y="98" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">~/.ssh/authorized_keys</text>
    <text x="120" y="113" text-anchor="middle" font-size="9" fill="#1e3a8a">Contiene clave pública del cliente</text>
    <text x="120" y="127" text-anchor="middle" font-size="9" fill="#64748b">(Permisos estrictos: 600)</text>

    <!-- Step detail in server -->
    <rect x="15" y="165" width="210" height="145" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="185" font-size="11" font-weight="700" fill="#0f172a">Fortificación en sshd_config:</text>
    <text x="25" y="205" font-size="10" font-weight="600" fill="#dc2626">PermitRootLogin no</text>
    <text x="25" y="222" font-size="10" font-weight="600" fill="#dc2626">PasswordAuthentication no</text>
    <text x="25" y="239" font-size="10" font-weight="600" fill="#15803d">PubkeyAuthentication yes</text>
    <text x="25" y="258" font-size="10" fill="#475569">Verificación criptográfica:</text>
    <text x="25" y="274" font-size="9" fill="#334155">El servidor usa la clave pública para</text>
    <text x="25" y="288" font-size="9" fill="#334155">validar matemáticamente la firma.</text>
  </g>
</svg>